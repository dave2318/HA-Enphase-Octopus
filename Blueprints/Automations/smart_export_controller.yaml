blueprint:
  name: "Energy: Smart Export Controller (Profit Floor & DFS Lockout)"
  description: >-
    Dynamic battery export arbitrage based on Octopus Energy rates and Enphase/Solcast data.
    Automatically exports to the grid when profitable while maintaining dynamic winter/summer reserves.
    Includes a 1.5p minimum profit floor, Unicorn Dump, and Octopus DFS Lockout.
  domain: automation
  input:
    cfg_sensor_soc:
      name: Battery SOC Sensor
      description: The sensor tracking your physical battery percentage.
      selector:
        entity:
          domain: sensor
          device_class: battery
    cfg_sensor_export_rate:
      name: Octopus Export Rate
      description: Your current Octopus Export price sensor.
      selector:
        entity:
          domain: sensor
    cfg_sensor_import_rate:
      name: Octopus Import Rate
      description: Your current Octopus Import price sensor.
      selector:
        entity:
          domain: sensor
    cfg_sensor_dfs_lockout:
      name: DFS Lockout Sensor (All Day)
      description: The custom template sensor that stays ON all day when a session is scheduled.
      selector:
        entity:
          domain: binary_sensor
    cfg_sensor_dfs_active:
      name: DFS Active Session Sensor (Live Event)
      description: The Octopus integration sensor that only turns ON during the actual session.
      selector:
        entity:
          domain: binary_sensor
    cfg_switch_export:
      name: Battery Export Switch
      description: The switch that forces your battery to discharge to the grid.
      selector:
        entity:
          domain: switch
    cfg_switch_charge:
      name: Battery Grid Charge Switch
      description: The switch that forces your battery to charge from the grid.
      selector:
        entity:
          domain: switch
    cfg_notify_service:
      name: Notification Entity
      description: The entity ID where you want to receive alerts (e.g., notify.notify).
      default: notify.notify
      selector:
        text:

# ====================================================
# AUTOMATION LOGIC
# ====================================================

mode: single

triggers:
  - id: rate_change
    entity_id:
      - !input cfg_sensor_export_rate
      - !input cfg_sensor_import_rate
    trigger: state
  - id: dfs_lockout_change
    entity_id: !input cfg_sensor_dfs_lockout
    trigger: state
  - id: dfs_active_change
    entity_id: !input cfg_sensor_dfs_active
    trigger: state
  - id: soc_change
    entity_id: !input cfg_sensor_soc
    trigger: state
  - minutes: /10
    trigger: time_pattern
  - at: "00:00:00"
    trigger: time

actions:
  - condition: template
    value_template: >-
      {% set dtg = states[cfg_switch_export].last_changed %}  
      {% set cfg = states[cfg_switch_charge].last_changed %}  
      {% set dtg_ok = dtg is none or (now() - dtg).total_seconds() > 120 %}  
      {% set cfg_ok = cfg is none or (now() - cfg).total_seconds() > 120 %}  
      {{ dtg_ok and cfg_ok }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ should_export_goal }}"
          - condition: template
            value_template: "{{ is_state(cfg_switch_export, 'off') }}"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: "{{ cfg_switch_export }}"
          - action: logbook.log
            data:
              name: Smart Export Controller
              message: >-
                Started Export. Reason: {{ start_reason_long }}. SOC: {{ soc_val }}%,
                Winter Floor: {{ export_floor_val }}%
              entity_id: "{{ cfg_switch_export }}"
          - action: "{{ cfg_notify_service }}"
            data:
              title: "💰 Export Active: {{ start_reason_short }}"
              message: |
                STATUS: STARTING EXPORT
                REASON: {{ start_reason_long }}

                [SYSTEM STATE]
                - Battery SOC: {{ soc_val }}%
                - Dynamic Reserve: {{ reserve_val }}%
                - Winter Floor: {{ export_floor_val }}%
                - Winter Mode: {{ 'ON' if is_winter else 'Off' }}

                [PRICING & CALCULATIONS]
                - Export Rate: {{ export_rate_val }}p
                - Import Rate: {{ import_rate_val }}p
                - Current Net Profit: {{ net_profit }}p/kWh
      - conditions:
          - condition: template
            value_template: "{{ not should_export_goal }}"
          - condition: template
            value_template: "{{ is_state(cfg_switch_export, 'on') }}"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: "{{ cfg_switch_export }}"
          - action: logbook.log
            data:
              name: Smart Export Controller
              message: "Stopped Export. Primary Reason: {{ stop_reason_long }}"
              entity_id: "{{ cfg_switch_export }}"
          - action: "{{ cfg_notify_service }}"
            data:
              title: "🛡️ Export Stopped: {{ stop_reason_short }}"
              message: |
                STATUS: STOPPING EXPORT
                PRIMARY REASON: {{ stop_reason_long }}

                [DETAILED DIAGNOSTICS]
                - Battery SOC: {{ soc_val }}%
                - Dynamic Reserve: {{ reserve_val }}%
                - Winter Safety Floor: {{ export_floor_val }}%
                - Winter Mode: {{ 'ACTIVE' if is_winter else 'Inactive' }}

variables:
  cfg_sensor_soc: !input cfg_sensor_soc
  cfg_sensor_export_rate: !input cfg_sensor_export_rate
  cfg_sensor_import_rate: !input cfg_sensor_import_rate
  cfg_sensor_dfs_lockout: !input cfg_sensor_dfs_lockout
  cfg_sensor_dfs_active: !input cfg_sensor_dfs_active
  cfg_switch_export: !input cfg_switch_export
  cfg_switch_charge: !input cfg_switch_charge
  cfg_notify_service: !input cfg_notify_service
  
  # --- Configuration Thresholds ---
  min_profit: 1.5
  huge_profit: 15.0  
  
  # --- DFS States ---
  dfs_locked_out: "{{ is_state(cfg_sensor_dfs_lockout, 'on') }}" 
  is_dfs_running: "{{ is_state(cfg_sensor_dfs_active, 'on') }}"

  # --- Core Variables ---
  sys_rte: "{{ states('input_number.battery_efficiency_rte') | float(0.83) }}"
  soc_val: "{{ states(cfg_sensor_soc) | float(0) }}"
  export_floor_val: "{{ states('sensor.battery_export_floor') | float(0) }}"
  reserve_val: "{{ states('sensor.dynamic_reserve') | float(0) }}"
  export_rate_val: "{{ states(cfg_sensor_export_rate) | float(0) }}"
  import_rate_val: "{{ states(cfg_sensor_import_rate) | float(0) }}"
  is_winter: "{{ is_state('input_boolean.winter_mode', 'on') }}"
  is_holiday: "{{ is_state('input_boolean.holiday_mode', 'on') }}"
  is_cheap: "{{ is_state('binary_sensor.in_cheap_import_window', 'on') }}"
  is_peak: "{{ is_state('binary_sensor.in_peak_window', 'on') }}"
  car_charging: "{{ is_state('binary_sensor.hard_block_active', 'on') }}"
  is_smart_peak: "{{ is_state('binary_sensor.smart_peak_export_active', 'on') }}"
  
  # --- Profitability Math ---
  net_profit: "{{ (export_rate_val - (import_rate_val / sys_rte)) | round(2) }}"
  is_profitable: "{{ net_profit >= min_profit }}"
  is_huge_profit: "{{ net_profit >= huge_profit }}"
  
  # --- The Master Logic Gate ---
  should_export_goal: >-
    {% set hard_blocked = is_cheap or car_charging %}
    {% set unicorn_dump = is_huge_profit and soc_val > export_floor_val %}
    {% set golden_slot = is_smart_peak and soc_val > export_floor_val %}
    {% set standard_daytime = is_profitable and soc_val > reserve_val %}
    {% set normal_exports = (standard_daytime or golden_slot) and not dfs_locked_out %}
    {% set dfs_dump = is_dfs_running and soc_val > export_floor_val %}
    
    {{ not hard_blocked and (unicorn_dump or normal_exports or dfs_dump) }}
  
  # --- Notification Strings ---
  start_reason_short: >-
    {% if is_dfs_running %}DFS Session{% elif is_huge_profit %}Unicorn Dump{% elif is_smart_peak %}Smart Peak{% else %}Price Profit{% endif %}
    
  start_reason_long: >-
    {% if is_dfs_running %}Saving Session (DFS) Active{% elif is_huge_profit %}Massive Profit Spike Detected{% elif is_smart_peak %}Smart Peak Surplus{% else %}Standard Price Arbitrage{% endif %}

  stop_reason_short: >-
    {% if car_charging %}EV Block{% elif is_cheap %}Cheap Rate{% elif dfs_locked_out and not (is_huge_profit or is_dfs_running) %}DFS Lockout{% elif (is_smart_peak or is_huge_profit or is_dfs_running) and soc_val <= export_floor_val %}Floor Hit{% elif not is_smart_peak and soc_val <= reserve_val %}Reserve Hit{% else %}Low Profit{% endif %}
  
  stop_reason_long: >-
    {% if car_charging %}EV/Cheap charging is active.{% elif is_cheap %}Grid import rates are in the cheap window.{% elif dfs_locked_out and not (is_huge_profit or is_dfs_running) %}A lucrative Saving Session (DFS) is scheduled today. Standard exports are blocked.{% elif (is_smart_peak or is_huge_profit or is_dfs_running) and soc_val <= export_floor_val %}High-value dump complete: SOC reached the safety floor ({{ export_floor_val }}%).{% elif not is_smart_peak and soc_val <= reserve_val %}Daytime arbitrage stopped: SOC ({{ soc_val }}%) hit the Dynamic Reserve ({{ reserve_val }}%).{% elif not is_smart_peak and is_state('binary_sensor.smart_peak_export_active', 'off') and soc_val > reserve_val %}The Smart Peak export window deactivated or hit its SOC limit.{% else %}Net profit ({{ net_profit }}p) is below the {{ min_profit }}p threshold.{% endif %}
